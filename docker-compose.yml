services:
  postgres:
    image: postgres:16
    container_name: redmine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: verySecretPassword
      POSTGRES_DB: redmine
    volumes:
      - redmine-pgdata:/var/lib/postgresql/data
      - ./init-n8n-db.sh:/docker-entrypoint-initdb.d/init-n8n-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - redmine-ai

  redmine:
    build: .
    container_name: redmine-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REDMINE_DB_POSTGRES: postgres
      REDMINE_DB_PORT: 5432
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: verySecretPassword
      POSTGRES_DB: redmine
      SECRET_KEY_BASE: change-me-to-a-real-random-string
    volumes:
      - ./redmine/files:/usr/src/redmine/files
      - ./redmine/log:/usr/src/redmine/log
      - ./redmine/tmp:/usr/src/redmine/tmp
      - ./redmine/plugin_assets:/usr/src/redmine/public/plugin_assets
      - ./redmine/themes:/usr/src/redmine/themes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - redmine-ai

  ai-proxy:
    build:
      context: .
      dockerfile: Dockerfile.ai-proxy
    container_name: ai-proxy
    restart: unless-stopped
    networks:
      - redmine-ai

  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: redmine
      DB_POSTGRESDB_PASSWORD: verySecretPassword
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "admin"
      N8N_BASIC_AUTH_PASSWORD: "n8n-secret"
    volumes:
      - n8n-data:/home/node/.n8n
      - /Users/jmadhead/IdeaProjects:/data/IdeaProjects
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - redmine-ai

  opencode:
    build:
      context: .
      dockerfile: Dockerfile.opencode
    container_name: opencode
    restart: unless-stopped
    ports:
      - "4096:4096"
    volumes:
      - ./opencode-container-config.jsonc:/root/.config/opencode/opencode.jsonc
      - ./agents:/root/.config/opencode/agents
      - /Users/jmadhead/IdeaProjects/redmine-ai/redmine-mcp:/root/.config/opencode/redmine-mcp
      - /Users/jmadhead/IdeaProjects:/app/IdeaProjects
    working_dir: /app/IdeaProjects/redmine-ai
    command: serve --port 4096 --hostname 0.0.0.0
    networks:
      - redmine-ai
    depends_on:
      - ai-proxy
      - redmine

volumes:
  redmine-pgdata:
  n8n-data:

networks:
  redmine-ai:
    driver: bridge
