services:
  postgres:
    image: postgres:16
    container_name: redmine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: verySecretPassword
      POSTGRES_DB: redmine
    volumes:
      - redmine-pgdata:/var/lib/postgresql/data
      - ./init-redmine-db.sh:/docker-entrypoint-initdb.d/init-redmine-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - redmine-ai

  redmine:
    build: .
    container_name: redmine-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REDMINE_DB_POSTGRES: postgres
      REDMINE_DB_PORT: 5432
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: verySecretPassword
      POSTGRES_DB: redmine
      SECRET_KEY_BASE: change-me-to-a-real-random-string
    volumes:
      - ./redmine/files:/usr/src/redmine/files
      - ./redmine/log:/usr/src/redmine/log
      - ./redmine/tmp:/usr/src/redmine/tmp
      - ./redmine/plugin_assets:/usr/src/redmine/public/plugin_assets
      - ./redmine/themes:/usr/src/redmine/themes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - redmine-ai

  ai-proxy:
    build:
      context: .
      dockerfile: Dockerfile.ai-proxy
    container_name: ai-proxy
    restart: unless-stopped
    networks:
      - redmine-ai

  webhook-server:
    build:
      context: ./opencode-webhook-server
      dockerfile: Dockerfile
    container_name: webhook-server
    restart: unless-stopped
    ports:
      - "8091:8080"
    environment:
      OPENCODE_URL: http://opencode:4096
      WEBHOOK_PORT: 8080
      POLL_INTERVAL_MS: 2000
      MAX_POLL_TIMEOUT: 600000
    depends_on:
      - opencode
    networks:
      - redmine-ai

  opencode:
    build:
      context: .
      dockerfile: Dockerfile.opencode
    container_name: opencode
    restart: unless-stopped
    ports:
      - "4096:4096"
    volumes:
      - ./opencode-container-config.jsonc:/root/.config/opencode/opencode.jsonc
      - ./agents:/root/.config/opencode/agents
      - /Users/jmadhead/IdeaProjects/redmine-ai/redmine-mcp:/root/.config/opencode/redmine-mcp
      - /Users/jmadhead/IdeaProjects:/app/IdeaProjects
    working_dir: /app/IdeaProjects/redmine-ai
    command: --log-level DEBUG serve --port 4096 --hostname 0.0.0.0
    networks:
      - redmine-ai
    depends_on:
      - ai-proxy
      - redmine

volumes:
  redmine-pgdata:

networks:
  redmine-ai:
    driver: bridge
